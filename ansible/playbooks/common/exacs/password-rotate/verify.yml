---
- name: Read the CDB after the password rotation
  oracle.oci.oci_database_database_facts:
    database_id: "{{ exacs_rotate_database_id }}"
    auth_type: "{{ exacs_auth_type }}"
  register: exacs_rotate_post_database_state
  check_mode: false

# OCI never returns a password, so verification is necessarily indirect: the
# strongest evidence available is that the CDB survived the change and is
# still serving.
- name: Assert the CDB remained available after the rotation
  ansible.builtin.assert:
    quiet: true
    that:
      - exacs_rotate_post_database_state.databases | length == 1
      - exacs_rotate_post_database_state.databases[0].lifecycle_state == 'AVAILABLE'
    fail_msg: >-
      The password rotation completed but the CDB is not available.
  check_mode: false

- name: Report the password rotation result
  ansible.builtin.debug:
    msg:
      db_name: "{{ exacs_rotate_post_database_state.databases[0].db_name }}"
      lifecycle_state: "{{ exacs_rotate_post_database_state.databases[0].lifecycle_state }}"
      note: >-
        The administrator password was updated. OCI never returns password
        values, so this report only confirms the CDB stayed available through
        the change, not the new value itself.
