---
# The change was made on the host, but the evidence still comes from OCI.
# That is the point: a host operation does not become unobservable.
- name: Read the CDB after the bounce
  oracle.oci.oci_database_database_facts:
    database_id: "{{ exacs_bounce_database_id }}"
    auth_type: "{{ exacs_auth_type }}"
  register: exacs_bounce_post_database_state
  check_mode: false

- name: Read the PDBs after the bounce
  oracle.oci.oci_database_pluggable_database_facts:
    database_id: "{{ exacs_bounce_database_id }}"
    auth_type: "{{ exacs_auth_type }}"
  register: exacs_bounce_post_pdb_state
  check_mode: false

- name: Assert the CDB and its PDBs came back
  ansible.builtin.assert:
    quiet: true
    that:
      - exacs_bounce_post_database_state.databases | length == 1
      - exacs_bounce_post_database_state.databases[0].lifecycle_state == 'AVAILABLE'
      - >-
        exacs_bounce_post_pdb_state.pluggable_databases
        | rejectattr('open_mode', 'equalto', 'READ_WRITE')
        | list | length == 0
    fail_msg: >-
      The bounce completed but the CDB is not available, or a pluggable
      database did not reopen for read/write work.
  check_mode: false

- name: Report the final state after the bounce
  ansible.builtin.debug:
    msg:
      db_name: "{{ exacs_bounce_post_database_state.databases[0].db_name }}"
      lifecycle_state: "{{ exacs_bounce_post_database_state.databases[0].lifecycle_state }}"
      pluggable_databases: >-
        {{ exacs_bounce_post_pdb_state.pluggable_databases
           | map(attribute='pdb_name') | zip(
             exacs_bounce_post_pdb_state.pluggable_databases
             | map(attribute='open_mode')) | list }}
