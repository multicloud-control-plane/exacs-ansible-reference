---
- name: Read the current database
  oracle.oci.oci_database_database_facts:
    database_id: "{{ exacs_patch_database_id }}"
    auth_type: "{{ exacs_auth_type }}"
  register: exacs_patch_database_state
  check_mode: false

- name: Validate the approved out-of-place patch boundary
  ansible.builtin.assert:
    quiet: true
    that:
      - exacs_patch_database_state.databases | length == 1
      - exacs_patch_database_state.databases[0].lifecycle_state == 'AVAILABLE'
      - exacs_patch_database_state.databases[0].db_name == exacs_patch_database_name
      - exacs_patch_database_state.databases[0].db_home_id == exacs_patch_source_db_home_id
      - exacs_patch_database_state.databases[0].compartment_id == exacs_patch_compartment_id
      - exacs_patch_source_db_home.lifecycle_state == 'AVAILABLE'
      - exacs_patch_source_db_home.vm_cluster_id == exacs_patch_vm_cluster_id
      - exacs_patch_target_db_home.lifecycle_state == 'AVAILABLE'
      - exacs_patch_target_db_home.vm_cluster_id == exacs_patch_vm_cluster_id
      - exacs_patch_target_db_home.db_version == exacs_patch_target_db_version
      - exacs_patch_target_db_home_id != exacs_patch_source_db_home_id
    fail_msg: >-
      The requested patch does not match the current database state, the
      target Database Home version, or the approved VM Cluster.
  check_mode: false

- name: Report observed out-of-place patch state
  ansible.builtin.debug:
    msg:
      database_before_patch: "{{ exacs_patch_database_state.databases[0].db_home_id }}"
      source_database_home: "{{ exacs_patch_source_db_home.display_name }}"
      target_database_home: "{{ exacs_patch_target_db_home.display_name }}"
      target_db_version: "{{ exacs_patch_target_db_home.db_version }}"
