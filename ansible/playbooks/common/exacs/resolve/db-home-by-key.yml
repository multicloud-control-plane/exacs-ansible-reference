---
# Shared helper: resolve exactly one Database Home from its ownership tags.
#
# The caller sets every input as an exacs_resolve_* var:
#   exacs_resolve_compartment_id, exacs_resolve_key
#   exacs_resolve_vm_cluster_id  (optional: narrows the search to one cluster)
#
# It leaves the single match in exacs_resolve_db_home. Copy that into an
# operation-scoped var immediately, because a second import overwrites it.
- name: List Database Homes in the approved scope
  oracle.oci.oci_database_db_home_facts:
    compartment_id: "{{ exacs_resolve_compartment_id }}"
    vm_cluster_id: "{{ exacs_resolve_vm_cluster_id | default(omit, true) }}"
    auth_type: "{{ exacs_auth_type }}"
  register: exacs_resolve_db_home_listing
  check_mode: false

- name: Select the Database Home owning the requested key
  ansible.builtin.set_fact:
    # Read as one sentence: of the Database Homes in scope, keep the ones that
    # carry ownership tags, then the ones belonging to this project, this
    # environment and this resource key. The 'defined' step is required: without
    # it the expression fails as soon as any Home lacks the tag.
    exacs_resolve_db_home_matches: >-
      {{ exacs_resolve_db_home_listing.db_homes
         | selectattr('freeform_tags.exacs_project', 'defined')
         | selectattr('freeform_tags.exacs_project', 'equalto', exacs_project)
         | selectattr('freeform_tags.exacs_environment', 'equalto', exacs_environment)
         | selectattr('freeform_tags.exacs_resource_key', 'equalto', exacs_resolve_key)
         | list }}
  check_mode: false

- name: Validate the Database Home resolution
  ansible.builtin.assert:
    quiet: true
    that:
      - exacs_resolve_db_home_matches | length == 1
      - exacs_resolve_db_home_matches[0].lifecycle_state == 'AVAILABLE'
    fail_msg: >-
      No single available Database Home owns resource key
      {{ exacs_resolve_key }} in this project and environment.
  check_mode: false

- name: Bind the resolved Database Home
  ansible.builtin.set_fact:
    exacs_resolve_db_home: "{{ exacs_resolve_db_home_matches[0] }}"
  check_mode: false
