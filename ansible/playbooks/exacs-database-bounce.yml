---
- name: ExaCS Database Bounce
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ operation_file }}"

  vars:
    exacs_auth_type: >-
      {{ lookup('ansible.builtin.env', 'OCI_ANSIBLE_AUTH_TYPE') | default('instance_principal', true) }}

  pre_tasks:
    - name: Require an explicit execution mode
      ansible.builtin.import_tasks: common/exacs/operation/require-execution-mode.yml

  tasks:
    - name: Resolve the approved resource identities
      ansible.builtin.import_tasks: common/exacs/database-bounce/resolve.yml

    - name: Precheck the database bounce
      ansible.builtin.import_tasks: common/exacs/database-bounce/precheck.yml

    - name: Apply the approved database bounce
      ansible.builtin.import_tasks: common/exacs/database-bounce/apply.yml
      when: operation_execution_mode == 'execute'

    - name: Verify the database bounce
      ansible.builtin.import_tasks: common/exacs/database-bounce/verify.yml
      when: operation_execution_mode == 'execute'
