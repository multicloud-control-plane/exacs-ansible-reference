---
- name: ExaCS CDB Create
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ operation_file }}"
  vars:
    exacs_auth_type: "{{ lookup('ansible.builtin.env', 'OCI_ANSIBLE_AUTH_TYPE') | default('instance_principal', true) }}"
    exacs_resource_tags:
      exacs_project: "{{ exacs_project }}"
      exacs_environment: "{{ exacs_environment }}"
      exacs_resource_key: "{{ exacs_cdb_key }}"
    # The PDB that OCI creates alongside the CDB gets its own key, so that no
    # two resources share one.
    exacs_cdb_initial_pdb_tags:
      exacs_project: "{{ exacs_project }}"
      exacs_environment: "{{ exacs_environment }}"
      exacs_resource_key: "{{ exacs_cdb_initial_pdb_key }}"
  pre_tasks:
    - name: Require an explicit execution mode
      ansible.builtin.import_tasks: common/exacs/operation/require-execution-mode.yml
  tasks:
    - name: Precheck the CDB creation
      ansible.builtin.import_tasks: common/exacs/cdb-create/precheck.yml

    - name: Apply the approved CDB creation
      ansible.builtin.import_tasks: common/exacs/cdb-create/apply.yml
      when: operation_execution_mode == 'execute'

    - name: Verify the CDB creation
      ansible.builtin.import_tasks: common/exacs/cdb-create/verify.yml
      when: operation_execution_mode == 'execute'
